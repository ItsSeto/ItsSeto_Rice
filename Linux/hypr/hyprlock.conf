background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2

    inner_color = rgba(40, 44, 52, 0.9)
    outer_color = rgba(244, 166, 193, 1.0)
    font_color = rgba(245, 240, 245, 1.0)

    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(245, 240, 245, 1.0)
    font_size = 24

    position = 0, 20
    halign = center
    valign = center
}
